name: build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout librewolf-void
        uses: actions/checkout@v7
      - name: validate release tag
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' srcpkgs/librewolf/template)
          expected="${version}-${_rev}"
          [ "${TAG}" = "${expected}" ] || {
            echo "Release tag ${TAG} does not match package version ${expected}"
            exit 1
          }
      - name: create release
        if: ${{ steps.build.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' librewolf/srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' librewolf/srcpkgs/librewolf/template)
          : "${version:?}" "${_rev:?}"
          gh release view "${TAG}" >/dev/null 2>&1 && exit 0
          gh release create "${TAG}" \
            --title "librewolf ${TAG}" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${version}-${_rev}" \
            --latest=false

      - name: upload assets
        if: ${{ steps.build.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release upload "${{ github.ref_name }}" \
            "librewolf-${LIBREWOLF_VERSION}.xbps" \
            "librewolf-${LIBREWOLF_VERSION}.xbps.sig2" \
            --clobber

      - name: cleanup generated package artifacts
        if: ${{ always() }}
        run: |
          set -eu
          [ -d void-packages ] || exit 0
          cd void-packages
          if [ -d hostdir/binpkgs ]; then
            find hostdir/binpkgs -maxdepth 1 -type f \
              \( -name 'librewolf-*.xbps' -o -name 'librewolf-*.xbps.sig2' \) \
              -delete || true
          fi
          if [ -d masterdir/builddir ]; then
            find masterdir/builddir -mindepth 1 -maxdepth 1 -type d \
              -name 'librewolf-*' -exec rm -rf -- {} + 2>/dev/null || true
          fi
          df -h / | tail -n 1
  latest:
    needs: [release, build]
    if: ${{ needs.release.result == 'success' && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --latest
