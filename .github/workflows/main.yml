name: build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout librewolf-void
        uses: actions/checkout@v4
      - name: validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' srcpkgs/librewolf/template)
          expected="${version}-${_rev}"
          [ "${TAG}" = "${expected}" ] || {
            echo "Release tag ${TAG} does not match package version ${expected}"
            exit 1
          }
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' srcpkgs/librewolf/template)
          : "${version:?}" "${_rev:?}"
          gh release view "${TAG}" >/dev/null 2>&1 && exit 0
          gh release create "${TAG}" \
            --title "librewolf ${TAG}" \
            --notes "https://librewolf.dev/librewolf/source/releases/tag/${version}-${_rev}" \
            --latest=false

  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { host: x86_64-musl, target: x86_64-musl }
    runs-on: ubuntu-22.04
    steps:
      - name: free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force

      - name: checkout librewolf-void
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: librewolf

      - name: checkout void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: record void-packages revision
        id: void_revision
        working-directory: void-packages
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: copy librewolf into srcpkgs
        run: cp -rv librewolf/srcpkgs/librewolf void-packages/srcpkgs

      - name: cache xbps source state
        uses: actions/cache@v4
        with:
          path: void-packages/hostdir
          key: ${{ runner.os }}-x86_64-musl-hostdir-${{ steps.void_revision.outputs.sha }}-${{ hashFiles('librewolf/srcpkgs/librewolf/template') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-musl-hostdir-${{ steps.void_revision.outputs.sha }}-
            ${{ runner.os }}-x86_64-musl-hostdir-

      - name: cache xbps build state
        uses: actions/cache@v4
        with:
          path: void-packages/masterdir-x86_64-musl
          key: ${{ runner.os }}-x86_64-musl-build-${{ steps.void_revision.outputs.sha }}-${{ hashFiles('librewolf/srcpkgs/librewolf/template', 'void-packages/xbps-src', 'void-packages/etc/defaults.conf') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-musl-build-${{ steps.void_revision.outputs.sha }}-

      - name: prepare xbps-static
        run: |
          mkdir -p .cache /opt/xbps
          if [ ! -s .cache/xbps-static.tar.xz ]; then
            curl -fL --retry 3 -o .cache/xbps-static.tar.xz https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          fi
          rm -rf /opt/xbps/usr
          tar xvf .cache/xbps-static.tar.xz -C /opt/xbps

      - name: build
        id: build
        env:
          XBPS_TARGET_ARCH: ${{ matrix.target }}
          XBPS_TARGET_MACHINE: x86_64-musl
        run: |
          set -eu
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages
          ./xbps-src -A x86_64-musl binary-bootstrap
          ./xbps-src pkg -j4 -A x86_64-musl librewolf

      - name: storage guard after build
        if: ${{ always() }}
        env:
          MIN_FREE_GB: 2
        run: |
          set -eu
          [ -d void-packages ] || exit 0
          cd void-packages

          template="../librewolf/srcpkgs/librewolf/template"
          current_version=$(sed -n 's/^version=//p' "$template")
          current_source=$(sed -n 's#^distfiles=.*librewolf-\([^/]*\)\.source\.tar\.gz.*#librewolf-\1.source.tar.gz#p' "$template")
          : "${current_version:?}" "${current_source:?}"

          if [ -d hostdir/sources ]; then
            find hostdir/sources -maxdepth 1 -type f \
              -name 'librewolf-*.source.tar.gz' \
              ! -name "$current_source" \
              -delete || true
          fi

          if [ -d hostdir/binpkgs ]; then
            find hostdir/binpkgs -maxdepth 1 -type f               \( -name 'librewolf-*.xbps' -o -name 'librewolf-*.xbps.sig2' \)               ! -name "librewolf-${current_version}_*.xbps"               ! -name "librewolf-${current_version}_*.xbps.sig2"               ! -name "librewolf-${current_version}.xbps"               ! -name "librewolf-${current_version}.xbps.sig2"               -delete || true
          fi

          if [ -d masterdir/builddir ]; then
            find masterdir/builddir -mindepth 1 -maxdepth 1 -type d \
              -name 'librewolf-*' -exec rm -rf -- {} + 2>/dev/null || true
          fi

          free_kb=$(df --output=avail / | tail -n 1 | tr -d ' ')
          min_kb=$((MIN_FREE_GB * 1024 * 1024))
          if [ "$free_kb" -lt "$min_kb" ]; then
            echo "::warning::Only $((free_kb / 1024 / 1024)) GiB free after LibreWolf cleanup; protected dependency caches were intentionally left untouched."
          else
            echo "Storage OK: $((free_kb / 1024 / 1024)) GiB free."
          fi
          df -h / | tail -n 1

      - name: sign
        if: ${{ steps.build.outcome == 'success' }}
        env:
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
          XBPS_TARGET_ARCH: ${{ matrix.target }}
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -eu
          export PATH="/opt/xbps/usr/bin/:$PATH"
          xbps-rindex -r "$PWD"
          xbps-rindex -s --signedby "${{ vars.SIGNEDBY }}" --privkey <(printf '%s' "${{ secrets.PRIV_KEY }}") "$PWD"
          xbps-rindex -S --privkey <(printf '%s' "${{ secrets.PRIV_KEY }}") ./*.xbps
          xbps-rindex -c "$PWD"

      - name: prepare simple package name
        if: ${{ steps.build.outcome == 'success' }}
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' ../../../librewolf/srcpkgs/librewolf/template)
          pkg=$(printf '%s\n' "librewolf-${version}_"*.xbps | head -n1)
          : "${version:?}" "${pkg:?}"
          cp -- "$pkg" "librewolf-${version}.xbps"
          cp -- "${pkg}.sig2" "librewolf-${version}.xbps.sig2"
          echo "LIBREWOLF_VERSION=${version}" >> "$GITHUB_ENV"

      - name: package sanity test
        if: ${{ steps.build.outcome == 'success' }}
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -eu
          pkg="librewolf-${LIBREWOLF_VERSION}.xbps"
          sig="${pkg}.sig2"
          test -s "$pkg"
          test -s "$sig"
          tar -tf "$pkg" >/dev/null
          xbps-rindex -c "$PWD"
          generated=$(printf '%s\n' "librewolf-${LIBREWOLF_VERSION}_"*.xbps | head -n1)
          cmp -s "$generated" "$pkg"
          cmp -s "${generated}.sig2" "$sig"

      - name: checksum
        if: ${{ steps.build.outcome == 'success' }}
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -eu
          sha256sum "librewolf-${LIBREWOLF_VERSION}.xbps"
          sha512sum "librewolf-${LIBREWOLF_VERSION}.xbps"

      - name: validate upload tag
        if: ${{ steps.build.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' librewolf/srcpkgs/librewolf/template)
          _rev=$(sed -n 's/^_rev=//p' librewolf/srcpkgs/librewolf/template)
          expected="${version}-${_rev}"
          [ "${GITHUB_REF_NAME}" = "${expected}" ]

      - name: upload assets
        if: ${{ steps.build.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        working-directory: void-packages/hostdir/binpkgs/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release upload "${{ github.ref_name }}" \
            "librewolf-${LIBREWOLF_VERSION}.xbps" \
            "librewolf-${LIBREWOLF_VERSION}.xbps.sig2" \
            --clobber

      - name: cleanup release package artifacts
        if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -eu
          [ -d void-packages ] || exit 0
          cd void-packages
          if [ -d hostdir/binpkgs ]; then
            find hostdir/binpkgs -maxdepth 1 -type f               \( -name 'librewolf-*.xbps' -o -name 'librewolf-*.xbps.sig2' \)               -delete || true
          fi
          if [ -d masterdir/builddir ]; then
            find masterdir/builddir -mindepth 1 -maxdepth 1 -type d \
              -name 'librewolf-*' -exec rm -rf -- {} + 2>/dev/null || true
          fi
          df -h / | tail -n 1
  latest:
    needs: [release, build]
    if: ${{ needs.release.result == 'success' && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --latest
